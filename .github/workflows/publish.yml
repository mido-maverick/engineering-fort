name: Publish to NuGet (Trusted)

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC (GitHub ↔ NuGet trust)
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag against version
        run: |
          version=$(dotnet msbuild EngineeringFort/EngineeringFort.csproj -getProperty:Version)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version> $version."
            exit 1
          fi

      # Build first and pack without building: packing a GeneratePackageOnBuild project in one step
      # looks for the satellite resource assemblies before they are built (NU5026).
      - name: Build project
        run: dotnet build EngineeringFort/EngineeringFort.csproj --configuration Release

      - name: Pack NuGet package
        run: dotnet pack EngineeringFort/EngineeringFort.csproj --configuration Release --no-build -o ./artifacts

      # 🔑 GitHub → NuGet OIDC authentication
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # 🚀 Publish package to NuGet.org
      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
